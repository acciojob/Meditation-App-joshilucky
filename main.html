<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meditation App</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div id="app">

        <!-- VIDEO SECTION -->
        <div class="vid-container">
            <video id="video" src="Videos/beach.mp4" loop></video>
        </div>

        <!-- SOUND PICKER -->
        <div class="sound-picker">
            <button data-sound="Sounds/rain.mp3" data-video="Videos/rain.mp4">
                <img src="https://cdn-icons-png.flaticon.com/512/4150/4150897.png" width="60" />
            </button>
            <button data-sound="Sounds/beach.mp3" data-video="Videos/beach.mp4">
                <img src="https://cdn-icons-png.flaticon.com/512/869/869869.png" width="60" />
            </button>
        </div>

        <!-- PLAYER SECTION -->
        <div class="player-container">

            <!-- TIME SELECT -->
            <div id="time-select">
                <button id="smaller-mins" data-time="120">2 Minutes</button>
                <button id="medium-mins" data-time="300">5 Minutes</button>
                <button id="long-mins" data-time="600">10 Minutes</button>
            </div>

            <!-- PLAY BUTTON -->
            <button class="play">►</button>

            <!-- TIME DISPLAY -->
            <div class="time-display">10:0</div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
