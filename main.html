<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Meditation App</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app">

        <!-- VIDEO AREA -->
        <div class="vid-container">
            <video class="video" src="Videos/beach.mp4" loop></video>
        </div>

        <!-- TIME SELECT BUTTONS -->
        <div class="time-select">
            <button id="smaller-mins" class="smaller-mins" data-time="120">2 Minutes</button>
            <button id="medium-mins" class="medium-mins" data-time="300">5 Minutes</button>
            <button id="long-mins" class="long-mins" data-time="600">10 Minutes</button>
        </div>

        <!-- SOUND PICKER -->
        <div class="sound-picker">
            <button data-sound="Sounds/rain.mp3" data-video="Videos/rain.mp4">🌧️</button>
            <button data-sound="Sounds/beach.mp3" data-video="Videos/beach.mp4">☀️</button>
        </div>

        <!-- PLAYER -->
        <div class="player-container">

            <!-- REQUIRED: Cypress needs audio tag -->
            <audio class="audio" src="Sounds/beach.mp3"></audio>

            <button class="play">►</button>

            <div class="time-display">10:0</div>
        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
