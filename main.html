<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meditation App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- VIDEO -->
    <div class="vid-container">
      <!-- video element must exist inside .vid-container -->
      <video class="video" src="Videos/beach.mp4" loop muted></video>
    </div>

    <!-- TIME SELECT (must have class time-select and exactly 3 buttons) -->
    <div class="time-select">
      <button id="smaller-mins" class="smaller-mins" data-time="120">2 Minutes</button>
      <button id="medium-mins"   class="medium-mins"  data-time="300">5 Minutes</button>
      <button id="long-mins"     class="long-mins"    data-time="600">10 Minutes</button>
    </div>

    <!-- SOUND PICKER -->
    <div class="sound-picker">
      <button data-sound="Sounds/rain.mp3"  data-video="Videos/rain.mp4" aria-label="rain">🌧️</button>
      <button data-sound="Sounds/beach.mp3" data-video="Videos/beach.mp4" aria-label="beach">☀️</button>
    </div>

    <!-- PLAYER (must have player-container and audio tag inside it) -->
    <div class="player-container">
      <!-- audio element required by tests -->
      <audio class="audio" src="Sounds/beach.mp3"></audio>

      <button class="play">►</button>

      <div class="time-display">10:0</div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
